name: Build StyleAI

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Skip pushes that only touch docs, scripts, or the prepare workflow
    # — they can't affect the iOS build output.
    paths-ignore:
      - "README.md"
      - "scripts/**"
      - ".github/workflows/prepare-ml-assets.yml"

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          # Use latest available Xcode on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "❌ No Xcode found"
            exit 1
          fi
          echo "📱 Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          echo "--- Xcode version ---"
          xcodebuild -version
          echo "--- Swift version ---"
          swift --version
          echo "--- Available SDKs ---"
          xcodebuild -showsdks | grep iOS

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          echo "✅ Generated .xcodeproj from project.yml"
          ls -la *.xcodeproj

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project StyleAI.xcodeproj \
            -scheme StyleAI
          echo "✅ Swift packages resolved"

      - name: Build for Device (Unsigned)
        # `bash --noprofile --norc -eo pipefail` is the GitHub default; turning
        # off -e and pipefail here is critical, otherwise xcodebuild's
        # non-zero exit kills the script before the diagnostic block runs.
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          set +o pipefail
          xcodebuild build \
            -project StyleAI.xcodeproj \
            -scheme StyleAI \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            > build.log 2>&1
          rc=$?
          xcpretty < build.log || true

          if [ $rc -ne 0 ]; then
            # 1) Emit one annotation per line containing "error:" — keep it
            #    dumb: no regex parsing, no escaping beyond %. The text shows
            #    up verbatim in the Annotations panel of the run.
            grep "error:" build.log | head -60 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error::${clean}"
            done
            # If nothing matched, at least say so loudly.
            if ! grep -q "error:" build.log; then
              echo "::error::xcodebuild exited $rc but no line containing 'error:' was found in build.log — the failure is likely in linking or signing. Check the build-log artifact."
            fi

            # 2) Also dump the full picture to the run Summary.
            {
              echo "## ❌ xcodebuild failed (exit $rc)"
              echo ""
              echo "### Every \`error:\` / \`warning:\` line"
              echo '```'
              grep -nE "error:|warning:" build.log || echo "(no matches)"
              echo '```'
              echo ""
              echo "### Last 200 lines of \`build.log\`"
              echo '```'
              tail -200 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            # 3) Print to step stdout too.
            echo ""
            echo "==================================================================="
            echo "❌ xcodebuild exit $rc — every error:/warning: line in build.log:"
            echo "==================================================================="
            grep -nE "error:|warning:" build.log || echo "(no error lines)"
            echo ""
            echo "==================================================================="
            echo "❌ Last 250 lines of raw xcodebuild output:"
            echo "==================================================================="
            tail -250 build.log
            exit $rc
          fi
          echo "✅ Build succeeded"

      - name: Upload raw build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_attempt }}
          path: build.log
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      - name: Upload raw build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
          if-no-files-found: warn

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/ipa

          # Find the .app bundle in the build products
          echo "📂 Searching for .app in build products..."
          find build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null

          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d 2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "⚠️ Not found in Release-iphoneos, searching all products..."
            APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app bundle found anywhere in build products"
            echo "📂 Full build directory listing:"
            find build/DerivedData/Build/Products -type f | head -50
            echo "📋 Last 50 lines of build log:"
            tail -50 build.log
            exit 1
          fi

          echo "📦 Found app: $APP_PATH"
          echo "📏 App size: $(du -sh "$APP_PATH" | cut -f1)"

          # Verify the binary exists and is ARM64
          APP_NAME=$(basename "$APP_PATH" .app)
          BINARY_PATH="$APP_PATH/$APP_NAME"
          if [ -f "$BINARY_PATH" ]; then
            echo "🔍 Binary architecture:"
            file "$BINARY_PATH"
            lipo -info "$BINARY_PATH" 2>/dev/null || true
          else
            echo "⚠️ Expected binary not found at: $BINARY_PATH"
            echo "📂 App bundle contents:"
            ls -la "$APP_PATH/"
          fi

          # Create Payload directory and copy .app
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/

          # Create IPA (zip with Payload folder)
          cd build
          zip -r ipa/StyleAI-unsigned.ipa Payload
          cd ..

          echo "✅ Unsigned IPA created"
          ls -lh build/ipa/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StyleAI-unsigned-ipa
          path: build/ipa/StyleAI-unsigned.ipa
          retention-days: 30
          if-no-files-found: warn
